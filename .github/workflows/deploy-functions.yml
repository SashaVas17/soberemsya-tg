name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qesuhhhiswwrfvfisfkp
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check functions
        run: |
          for fn in telegram-api telegram-bot notifications-worker; do
            deno check --node-modules-dir=none "supabase/functions/$fn/index.ts"
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Schema migrations are applied separately through the Supabase
      # connector before merge; this workflow only deploys function code.
      - name: Deploy functions
        run: |
          for fn in telegram-api telegram-bot notifications-worker; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
