name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Заметки Obsidian (docs/) и скиллы Claude не влияют на сайт
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

# Write rights only for the deploy job: the verify job runs npm packages.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: flocklyappbot
          VITE_TELEGRAM_APP_SHORT_NAME: app
          VITE_SERVER_FUNCTION_URL: ${{ vars.VITE_SERVER_FUNCTION_URL }}
          # Mock mode must never reach production, whatever the repository variables say.
          VITE_USE_MOCK_API: "false"
          VITE_USE_MOCK_TELEGRAM: "false"
          VITE_MOCK_INIT_DATA: ""
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
