name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Заметки Obsidian (docs/) и скиллы Claude не влияют на сайт
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

# Write rights only for the deploy job: the verify job runs npm packages.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: flocklyappbot
          VITE_TELEGRAM_APP_SHORT_NAME: app
          VITE_SERVER_FUNCTION_URL: ${{ vars.VITE_SERVER_FUNCTION_URL }}
          # Mock mode must never reach production, whatever the repository variables say.
          VITE_USE_MOCK_API: "false"
          VITE_USE_MOCK_TELEGRAM: "false"
          VITE_MOCK_INIT_DATA: ""
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
